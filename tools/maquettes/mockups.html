<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Maquettes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .fill { position: absolute; inset: 0; }
  .center { display: grid; place-items: center; }
  .shadow { box-shadow: 0 40px 80px -30px rgba(10, 20, 30, .45), 0 2px 6px rgba(10, 20, 30, .12); }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  .cond { font-family: Bahnschrift, "Segoe UI", sans-serif; }
  .mono { font-family: Consolas, "Courier New", monospace; }
</style>
</head>
<body>
<div id="root" class="fill"></div>
<script>
/* ==========================================================================
   Maquettes fictives pour le portfolio — une image par identifiant (?id=…).
   Chaque entrée : largeur, hauteur, fonction qui renvoie le HTML.
   ========================================================================== */

const M = {};
const def = (id, w, h, fn) => (M[id] = { w, h, fn });

/* ---------- Outils communs ---------- */

const browser = (url, inner, { r = 14, bar = "#ECEFF1" } = {}) => `
  <div style="position:absolute;inset:0;border-radius:${r}px;overflow:hidden;background:#fff;display:flex;flex-direction:column">
    <div style="height:44px;flex:none;background:${bar};display:flex;align-items:center;gap:8px;padding:0 18px">
      <span style="width:12px;height:12px;border-radius:50%;background:#FF5F57"></span>
      <span style="width:12px;height:12px;border-radius:50%;background:#FEBC2E"></span>
      <span style="width:12px;height:12px;border-radius:50%;background:#28C840"></span>
      <span style="margin-left:24px;flex:1;max-width:520px;height:26px;border-radius:7px;background:#fff;font-size:13px;color:#6b7680;display:flex;align-items:center;padding:0 12px">${url}</span>
    </div>
    <div style="position:relative;flex:1;overflow:hidden">${inner}</div>
  </div>`;

const phoneShell = (inner, { bg = "#111" } = {}) => `
  <div style="position:absolute;inset:0;border-radius:54px;background:${bg};padding:14px">
    <div style="position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:#fff">
      ${inner}
      <div style="position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000"></div>
    </div>
  </div>`;

const statusBar = (color = "#111") => `
  <div style="height:64px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 34px 8px;font-size:17px;font-weight:600;color:${color}">
    <span>9:41</span><span style="letter-spacing:2px">▮▮▮ ◔</span>
  </div>`;

const lines = (n, { w = "100%", h = 10, gap = 10, color = "rgba(0,0,0,.12)", last = "60%" } = {}) =>
  Array.from({ length: n }, (_, i) =>
    `<div style="height:${h}px;border-radius:${h / 2}px;background:${color};width:${i === n - 1 ? last : w};margin-bottom:${gap}px"></div>`
  ).join("");

/* ==========================================================================
   1. LAGUNE LODGE — site web d'un écolodge à Grand-Popo
   ========================================================================== */

const LAG = { sand: "#F1E8DA", teal: "#1F6F78", deep: "#15343A", sunset: "#E8875B", light: "#FAF6EF" };

const palm = (x, h, flip = false, color = "#16343A") => `
  <svg style="position:absolute;left:${x}%;bottom:0;height:${h}%;overflow:visible;transform:${flip ? "scaleX(-1)" : "none"}" viewBox="0 0 100 300">
    <path d="M50 300 C55 220 62 150 70 70" stroke="${color}" stroke-width="7" fill="none"/>
    <g fill="${color}">
      <path d="M70 70 C40 50 15 60 0 85 C25 65 45 65 70 74Z"/>
      <path d="M70 70 C95 45 125 50 140 75 C115 60 95 62 70 74Z"/>
      <path d="M70 70 C60 35 40 20 15 20 C42 30 55 45 68 72Z"/>
      <path d="M70 70 C85 35 110 22 135 25 C108 33 90 48 72 72Z"/>
      <path d="M70 70 C72 40 70 15 60 0 C78 18 80 45 72 72Z"/>
    </g>
  </svg>`;

const lagoonPhoto = ({ sun = true, palms = true } = {}) => `
  <div class="fill" style="background:linear-gradient(180deg,#F6C8A0 0%,#F0A77E 30%,#E8875B 47%,#A9C9C6 52%,#5E9EA0 70%,#1F6F78 100%)"></div>
  ${sun ? `<div style="position:absolute;left:58%;top:30%;width:15%;aspect-ratio:1;border-radius:50%;background:#FFE3B8;opacity:.9;filter:blur(1px)"></div>` : ""}
  <div class="fill" style="top:50%;background:repeating-linear-gradient(180deg,rgba(255,255,255,.18) 0 2px,transparent 2px 14px)"></div>
  <div style="position:absolute;left:0;right:0;top:49%;height:3%;background:#2E5A5C;opacity:.55;border-radius:50%"></div>
  ${palms ? palm(4, 78) + palm(14, 62, true) + palm(84, 70, true) : ""}`;

const lagLogo = (color = LAG.deep, size = 22) => `
  <span style="display:inline-flex;align-items:center;gap:10px;color:${color};font-size:${size}px;font-weight:600;letter-spacing:-.01em">
    <svg width="${size * 1.4}" height="${size}" viewBox="0 0 42 30"><path d="M2 18c6-8 12-8 19 0s13 8 19 0" stroke="currentColor" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M2 27c6-6 12-6 19 0s13 6 19 0" stroke="currentColor" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".5"/><circle cx="21" cy="6" r="5" fill="${LAG.sunset}"/></svg>
    <span class="serif" style="font-style:italic">Lagune Lodge</span>
  </span>`;

const lagNav = (light = false) => `
  <div style="position:absolute;left:0;right:0;top:0;height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 64px;z-index:2">
    ${lagLogo(light ? "#fff" : LAG.deep)}
    <div style="display:flex;gap:36px;font-size:16px;color:${light ? "#fff" : LAG.deep}">
      <span>Bungalows</span><span>Expériences</span><span>Restaurant</span><span>Contact</span>
    </div>
    <span style="padding:12px 22px;border-radius:999px;background:${light ? "#fff" : LAG.teal};color:${light ? LAG.deep : "#fff"};font-size:15px;font-weight:600">Réserver</span>
  </div>`;

const lagHome = () => `
  <div class="fill" style="background:${LAG.light}">
    <div style="position:absolute;left:0;right:0;top:0;height:74%;overflow:hidden">${lagoonPhoto()}<div class="fill" style="background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,transparent 60%,rgba(0,0,0,.25))"></div></div>
    ${lagNav(true)}
    <div style="position:absolute;left:64px;top:24%;max-width:660px;color:#fff">
      <div style="font-size:15px;letter-spacing:.2em;text-transform:uppercase;opacity:.9">Grand-Popo · Bénin</div>
      <div class="serif" style="font-size:72px;line-height:1.02;margin-top:18px">Respirer entre lagune et océan.</div>
      <div style="font-size:19px;margin-top:20px;opacity:.92;max-width:480px">12 bungalows en bois au bord de l'eau, une cuisine du marché et le rythme lent de la côte.</div>
    </div>
    <div style="position:absolute;left:64px;right:64px;top:66%;height:96px;border-radius:18px;background:#fff;display:flex;align-items:center;padding:0 28px;gap:28px" class="shadow">
      ${["Arrivée|Ven. 12 déc.", "Départ|Dim. 14 déc.", "Voyageurs|2 adultes"].map(t => { const [a, b] = t.split("|"); return `<div style="flex:1;border-right:1px solid #E6E1D8"><div style="font-size:13px;color:#8A8F8E">${a}</div><div style="font-size:19px;color:${LAG.deep};font-weight:600;margin-top:4px">${b}</div></div>`; }).join("")}
      <span style="padding:16px 28px;border-radius:12px;background:${LAG.sunset};color:#fff;font-weight:600;font-size:17px">Voir les disponibilités</span>
    </div>
    <div style="position:absolute;left:64px;right:64px;bottom:34px;display:flex;gap:28px">
      ${["Bungalow lagune", "Balade en pirogue", "Table du marché"].map((t, i) => `<div style="flex:1;display:flex;gap:16px;align-items:center"><div style="width:58px;height:58px;border-radius:14px;background:${[LAG.teal, LAG.sunset, "#C9A46A"][i]}"></div><div><div style="font-weight:600;color:${LAG.deep};font-size:17px">${t}</div><div style="font-size:14px;color:#7c8483">Découvrir →</div></div></div>`).join("")}
    </div>
  </div>`;

const roomCard = (name, price, hue) => `
  <div style="border-radius:18px;overflow:hidden;background:#fff" class="shadow">
    <div style="position:relative;height:250px;background:linear-gradient(160deg,${hue},#1F6F78)">
      <div style="position:absolute;left:12%;right:12%;bottom:0;height:58%;background:#C9A46A;clip-path:polygon(50% 0,100% 40%,100% 100%,0 100%,0 40%)"></div>
      <div style="position:absolute;left:40%;right:40%;bottom:0;height:26%;background:#5C3B22"></div>
    </div>
    <div style="padding:22px 24px">
      <div style="font-size:21px;font-weight:600;color:${LAG.deep}">${name}</div>
      <div style="font-size:15px;color:#7c8483;margin-top:6px">2 personnes · vue lagune · ventilateur</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px"><span style="font-size:18px;color:${LAG.deep}"><b>${price}</b> FCFA / nuit</span><span style="color:${LAG.teal};font-weight:600">Réserver →</span></div>
    </div>
  </div>`;

const lagRooms = () => `
  <div class="fill" style="background:${LAG.light}">
    ${lagNav()}
    <div style="position:absolute;left:64px;top:120px;right:64px">
      <div style="font-size:14px;letter-spacing:.2em;color:${LAG.teal};text-transform:uppercase">Nos bungalows</div>
      <div class="serif" style="font-size:52px;color:${LAG.deep};margin-top:10px">Dormir au bord de l'eau</div>
      <div style="display:flex;gap:12px;margin-top:26px">${["Tous", "Vue lagune", "Vue océan", "Famille"].map((t, i) => `<span style="padding:10px 18px;border-radius:999px;border:1px solid ${i ? "#D8D1C4" : LAG.deep};background:${i ? "transparent" : LAG.deep};color:${i ? LAG.deep : "#fff"};font-size:15px">${t}</span>`).join("")}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:34px">
        ${roomCard("Bungalow Héron", "45 000", "#F0A77E")}${roomCard("Bungalow Pélican", "52 000", "#A9C9C6")}${roomCard("Case Famille", "78 000", "#E8C48B")}
      </div>
    </div>
  </div>`;

const lagBooking = () => `
  <div class="fill" style="background:${LAG.light}">
    ${lagNav()}
    <div style="position:absolute;left:64px;top:120px;width:56%">
      <div class="serif" style="font-size:46px;color:${LAG.deep}">Votre séjour</div>
      <div style="margin-top:26px;border-radius:18px;background:#fff;padding:28px" class="shadow">
        <div style="display:flex;justify-content:space-between;color:${LAG.deep};font-weight:600;font-size:19px"><span>‹</span><span>Décembre 2025</span><span>›</span></div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:20px;text-align:center;font-size:16px;color:${LAG.deep}">
          ${["L", "M", "M", "J", "V", "S", "D"].map(d => `<span style="color:#9aa09f;font-size:13px">${d}</span>`).join("")}
          ${Array.from({ length: 31 }, (_, i) => { const d = i + 1; const sel = d >= 12 && d <= 14; const edge = d === 12 || d === 14; return `<span style="height:44px;display:grid;place-items:center;border-radius:12px;background:${edge ? LAG.teal : sel ? "#D7E7E6" : "transparent"};color:${edge ? "#fff" : LAG.deep}">${d}</span>`; }).join("")}
        </div>
      </div>
    </div>
    <div style="position:absolute;right:64px;top:120px;width:32%;border-radius:18px;background:#fff;padding:30px" class="shadow">
      <div style="height:170px;border-radius:12px;overflow:hidden;position:relative">${lagoonPhoto({ palms: false })}</div>
      <div style="font-size:22px;font-weight:600;color:${LAG.deep};margin-top:20px">Bungalow Héron</div>
      <div style="font-size:15px;color:#7c8483;margin-top:4px">12 → 14 déc. · 2 nuits · 2 adultes</div>
      <div style="margin-top:22px;border-top:1px solid #EEE8DE;padding-top:18px;font-size:16px;color:${LAG.deep}">
        <div style="display:flex;justify-content:space-between"><span>2 nuits × 45 000</span><span>90 000</span></div>
        <div style="display:flex;justify-content:space-between;margin-top:10px"><span>Petit-déjeuner</span><span>Inclus</span></div>
        <div style="display:flex;justify-content:space-between;margin-top:16px;font-weight:700;font-size:20px"><span>Total</span><span>90 000 FCFA</span></div>
      </div>
      <div style="margin-top:22px;padding:16px;border-radius:12px;background:${LAG.sunset};color:#fff;text-align:center;font-weight:600;font-size:17px">Confirmer · payer par Mobile Money</div>
    </div>
  </div>`;

const oldSite = () => `
  <div class="fill" style="background:#e9e9e9;font-family:Arial,sans-serif;color:#333">
    <div style="height:70px;background:#3a3a8a;color:#ff0;display:flex;align-items:center;padding:0 24px;font-size:26px;font-weight:bold">*** LAGUNE LODGE *** BIENVENUE !!!</div>
    <div style="display:flex;gap:6px;padding:8px;background:#ccc">${["ACCUEIL", "PHOTOS", "TARIFS 2019", "NOUS CONTACTER", "LIVRE D'OR"].map(t => `<span style="padding:6px 10px;background:#fff;border:1px solid #999;font-size:13px">${t}</span>`).join("")}</div>
    <div style="display:flex;gap:14px;padding:14px">
      <div style="flex:1;height:240px;background:#bbb;display:grid;place-items:center;color:#777">photo.jpg</div>
      <div style="flex:1;font-size:13px;line-height:1.5">${lines(9, { color: "#bbb", h: 9, gap: 9 })}<div style="color:red;font-weight:bold;margin-top:10px">PROMO !!! Appelez-nous au +229 ...</div></div>
    </div>
    <div style="margin:0 14px;padding:10px;background:#fff;border:1px dashed #999;font-size:12px">Réservation : envoyez un e-mail avec vos dates, nous vous répondrons sous 72 h.</div>
  </div>`;

def("lagune-cover", 1600, 1000, () => `
  <div class="fill" style="background:radial-gradient(120% 90% at 80% 10%,#F6D9BF,${LAG.sand} 60%)"></div>
  <div style="position:absolute;left:8%;top:12%;width:70%;height:72%" class="shadow">${browser("lagunelodge.bj", lagHome())}</div>
  <div style="position:absolute;right:7%;top:26%;width:17%;height:66%;border-radius:54px" class="shadow">${phoneShell(statusBar("#fff") + `<div class="fill" style="top:0">${lagoonPhoto({ palms: false })}${palm(62, 46, true)}</div><div style="position:absolute;left:24px;right:24px;top:110px;color:#fff;z-index:2"><div class="serif" style="font-size:34px;line-height:1.05">Respirer entre lagune et océan.</div></div><div style="position:absolute;left:20px;right:20px;bottom:28px;padding:16px;border-radius:14px;background:${LAG.sunset};color:#fff;text-align:center;font-weight:600">Réserver</div>`)}</div>`);

def("lagune-defi", 1600, 900, () => `
  <div class="fill" style="background:${LAG.sand}"></div>
  <div style="position:absolute;left:5%;top:14%;width:42%;height:66%;filter:grayscale(.2)" class="shadow">${browser("lagune-lodge.free.fr", oldSite(), { bar: "#ddd" })}</div>
  <div style="position:absolute;left:47.5%;top:44%;font-size:56px;color:${LAG.teal}">→</div>
  <div style="position:absolute;right:5%;top:14%;width:42%;height:66%" class="shadow">${browser("lagunelodge.bj", `<div style="position:absolute;inset:0;width:181%;height:181%;transform:scale(.553);transform-origin:0 0">${lagHome()}</div>`)}</div>
  <div style="position:absolute;left:5%;bottom:7%;font-size:22px;color:#8a7f70">Avant · 2019</div>
  <div style="position:absolute;right:5%;bottom:7%;font-size:22px;color:${LAG.teal};font-weight:600">Après · 2025</div>`);

def("lagune-home", 1600, 1000, () => `<div class="fill" style="background:${LAG.sand};padding:40px"><div style="position:relative;width:100%;height:100%" class="shadow">${browser("lagunelodge.bj", `<div style="position:absolute;inset:0;width:110%;height:110%;transform:scale(.91);transform-origin:0 0">${lagHome()}</div>`)}</div></div>`);
def("lagune-rooms", 1600, 1000, () => `<div class="fill" style="background:#DCE9E7;padding:40px"><div style="position:relative;width:100%;height:100%" class="shadow">${browser("lagunelodge.bj/bungalows", `<div style="position:absolute;inset:0;width:110%;height:110%;transform:scale(.91);transform-origin:0 0">${lagRooms()}</div>`)}</div></div>`);
def("lagune-booking", 1600, 1000, () => `<div class="fill" style="background:#F6DCC8;padding:40px"><div style="position:relative;width:100%;height:100%" class="shadow">${browser("lagunelodge.bj/reserver", `<div style="position:absolute;inset:0;width:110%;height:110%;transform:scale(.91);transform-origin:0 0">${lagBooking()}</div>`)}</div></div>`);

const lagPhone = (inner) => `<div class="fill" style="background:${LAG.sand};padding:36px 30px"><div style="position:relative;width:100%;height:100%;border-radius:54px" class="shadow">${phoneShell(inner)}</div></div>`;
def("lagune-mobile-1", 600, 1267, () => lagPhone(`<div class="fill">${lagoonPhoto({ palms: false })}${palm(64, 42, true)}</div><div style="position:relative;z-index:2">${statusBar("#fff")}</div><div style="position:absolute;left:26px;top:96px;z-index:2">${lagLogo("#fff", 18)}</div><div style="position:absolute;left:26px;right:26px;top:300px;color:#fff;z-index:2"><div style="font-size:12px;letter-spacing:.2em">GRAND-POPO · BÉNIN</div><div class="serif" style="font-size:40px;line-height:1.05;margin-top:12px">Respirer entre lagune et océan.</div></div><div style="position:absolute;left:22px;right:22px;bottom:34px;padding:18px;border-radius:14px;background:#fff;color:${LAG.deep};z-index:2"><div style="font-size:12px;color:#8a8f8e">Arrivée — Départ</div><div style="font-weight:600;margin-top:4px">12 → 14 déc. · 2 adultes</div><div style="margin-top:14px;padding:13px;border-radius:10px;background:${LAG.sunset};color:#fff;text-align:center;font-weight:600">Voir les disponibilités</div></div>`));
def("lagune-mobile-2", 600, 1267, () => lagPhone(`<div class="fill" style="background:${LAG.light}">${statusBar()}<div style="padding:10px 24px"><div class="serif" style="font-size:32px;color:${LAG.deep}">Bungalows</div><div style="display:flex;gap:8px;margin-top:14px">${["Tous", "Lagune", "Océan"].map((t, i) => `<span style="padding:7px 13px;border-radius:999px;font-size:13px;border:1px solid ${i ? "#D8D1C4" : LAG.deep};background:${i ? "transparent" : LAG.deep};color:${i ? LAG.deep : "#fff"}">${t}</span>`).join("")}</div>${["Bungalow Héron|45 000|#F0A77E", "Bungalow Pélican|52 000|#A9C9C6"].map(t => { const [n, p, c] = t.split("|"); return `<div style="margin-top:18px;border-radius:16px;overflow:hidden;background:#fff" class="shadow"><div style="height:170px;position:relative;background:linear-gradient(160deg,${c},${LAG.teal})"><div style="position:absolute;left:14%;right:14%;bottom:0;height:56%;background:#C9A46A;clip-path:polygon(50% 0,100% 40%,100% 100%,0 100%,0 40%)"></div></div><div style="padding:14px 16px"><div style="font-weight:600;color:${LAG.deep};font-size:18px">${n}</div><div style="font-size:14px;color:#7c8483;margin-top:4px"><b style="color:${LAG.deep}">${p}</b> FCFA / nuit</div></div></div>`; }).join("")}</div></div>`));
def("lagune-mobile-3", 600, 1267, () => lagPhone(`<div class="fill" style="background:${LAG.light}">${statusBar()}<div style="padding:10px 24px;color:${LAG.deep}"><div style="font-size:14px;color:#7c8483">Étape 3 sur 3</div><div class="serif" style="font-size:32px;margin-top:6px">Paiement</div><div style="margin-top:20px;border-radius:16px;background:#fff;padding:18px" class="shadow"><div style="font-weight:600">Bungalow Héron</div><div style="font-size:14px;color:#7c8483;margin-top:4px">12 → 14 déc. · 2 nuits</div><div style="display:flex;justify-content:space-between;margin-top:16px;font-weight:700;font-size:19px"><span>Total</span><span>90 000 FCFA</span></div></div><div style="margin-top:22px;font-weight:600">Payer avec</div>${["Mobile Money|#FFCC00", "Carte bancaire|#1F6F78", "Sur place|#C9A46A"].map((t, i) => { const [n, c] = t.split("|"); return `<div style="margin-top:10px;display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:#fff;border:2px solid ${i ? "transparent" : LAG.teal}"><span style="width:34px;height:34px;border-radius:9px;background:${c}"></span><span style="flex:1">${n}</span><span style="width:20px;height:20px;border-radius:50%;border:2px solid ${LAG.teal};background:${i ? "#fff" : LAG.teal}"></span></div>`; }).join("")}<div style="margin-top:26px;padding:16px;border-radius:12px;background:${LAG.sunset};color:#fff;text-align:center;font-weight:600">Confirmer la réservation</div></div></div>`));

/* ==========================================================================
   2. AYABA — identité d'une torréfaction de café à Cotonou
   ========================================================================== */

const AYA = { cream: "#F4EBDD", coffee: "#3B2418", clay: "#C65A32", gold: "#D9A441" };

const ayaMark = (size, { sun = AYA.gold, bean = AYA.coffee, line = AYA.cream } = {}) => `
  <svg width="${size}" height="${size}" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" fill="${sun}"/>
    <ellipse cx="50" cy="54" rx="22" ry="30" transform="rotate(-24 50 54)" fill="${bean}"/>
    <path d="M58 26 C40 40 62 62 42 82" stroke="${line}" stroke-width="5" fill="none" stroke-linecap="round"/>
  </svg>`;

const ayaWord = (size, color = AYA.coffee, sub = true) => `
  <div style="display:inline-flex;flex-direction:column;align-items:flex-start;color:${color}">
    <span class="serif" style="font-size:${size}px;font-style:italic;font-weight:700;letter-spacing:-.02em;line-height:.9">ayaba</span>
    ${sub ? `<span class="cond" style="font-size:${size * 0.16}px;letter-spacing:.32em;margin-top:${size * 0.12}px">TORRÉFACTION · COTONOU</span>` : ""}
  </div>`;
